[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[project]
name = "airalert-monitor"
version = "0.1.0"
description = "Monitoring publicznych komunikatow i wskaznikow ryzyka (OSINT) - NIE jest oficjalnym systemem alarmowania"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "feedparser>=6.0",
    "cryptography>=42.0",
]

[project.optional-dependencies]
db = ["psycopg2-binary>=2.9"]
test = [
    "pytest>=8.0",
    "pytest-cov",
    "httpx",  # TestClient transport
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
